# Mises à jour de sécurité proposées automatiquement (en pull request, à relire avant de fusionner).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      capacitor:
        patterns: ["@capacitor/*"]
      autres:
        patterns: ["*"]
        exclude-patterns: ["@capacitor/*"]
