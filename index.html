<!doctype html>
<html lang="fr">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Politique de sécurité : seuls nos propres fichiers s'exécutent, plus Turnstile (l'anti-robot de Cloudflare, chargé
     seulement dans le formulaire des propositions). Le réseau ne parle qu'à tchip.app (contenu, voix), api.tchip.app
     (propositions) et TelemetryDeck (statistiques, si activées). Aucun script écrit dans le HTML. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' https://tchip.app; connect-src 'self' https://tchip.app https://api.tchip.app https://nom.telemetrydeck.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>Tchip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Tchip — Tu parles d'où ? Chaque jour, une expression de la francophonie à deviner.">
<meta name="theme-color" content="#FF4D2E">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tchip">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
