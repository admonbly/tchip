# Tchip — API des propositions (voir api/README.md pour la mise en ligne).
name = "tchip-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

# api.tchip.app reçoit les propositions. Pas de page de tri en ligne : les propositions se lisent
# directement dans la base D1 (dashboard Cloudflare › D1, wrangler, ou l'API D1 depuis un agent).
# Pour réactiver une page de tri humaine un jour : remettre la route admin.tchip.app ci-dessous,
# protégée par Cloudflare Access, et remplir ACCESS_EQUIPE / ACCESS_AUD (code admin dans src/admin.js).
routes = [
  { pattern = "api.tchip.app", custom_domain = true }
]

# Tous les jours à 3 h (UTC) : purge des refus de plus de 90 jours et des compteurs anti-abus.
[triggers]
crons = ["0 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "tchip-propositions"
database_id = "a097a18e-827e-448f-b527-98682e3af31c"

[vars]
# D'où le formulaire peut envoyer : le site, et les apps (Capacitor iOS et Android).
ORIGINES = "https://tchip.app,capacitor://localhost,https://localhost"
# Cloudflare Access (Zero Trust › Access › Applications › admin.tchip.app) : domaine de l'équipe et « Audience (AUD) tag ».
ACCESS_EQUIPE = "A_REMPLIR"   # ex. https://tchip.cloudflareaccess.com
ACCESS_AUD = "A_REMPLIR"

# Secrets (jamais dans ce fichier) : npx wrangler secret put TURNSTILE_SECRET  et  npx wrangler secret put SEL
